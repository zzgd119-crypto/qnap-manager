name: Build & Release

# main 브랜치에 푸시하면 Android APK + Windows zip을 빌드해서 GitHub Release로 올린다.
# 앱은 이 Release를 확인해서 자동 업데이트한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.0"
  VERSION: "1.0.${{ github.run_number }}"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD 시크릿이 없습니다. README를 참고하세요."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=qnapmanager
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
      - run: flutter pub get
      - run: >
          flutter build apk --release
          --build-name=$VERSION --build-number=${{ github.run_number }}
          --dart-define=GH_REPO=${{ github.repository }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk qnap-manager-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: qnap-manager-android.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build windows --release
          --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}
          --dart-define=GH_REPO=${{ github.repository }}
      - name: zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath qnap-manager-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: qnap-manager-windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --pretty=%s)
          gh release create "v$VERSION" \
            qnap-manager-android.apk qnap-manager-windows.zip \
            --title "v$VERSION" --notes "$NOTES"
