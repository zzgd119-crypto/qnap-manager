name: Build & Release

# main 브랜치에 푸시하면 Android APK + Windows zip을 빌드해서 GitHub Release로 올린다.
# 앱은 이 Release를 확인해서 자동 업데이트한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.0"
  VERSION: "1.0.${{ github.run_number }}"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD 시크릿이 없습니다. README를 참고하세요."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=qnapmanager
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
      - run: flutter pub get
      - run: >
          flutter build apk --release
          --build-name=$VERSION --build-number=${{ github.run_number }}
          --dart-define=GH_REPO=${{ github.repository }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk qnap-manager-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: qnap-manager-android.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build windows --release
          --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}
          --dart-define=GH_REPO=${{ github.repository }}
      - name: zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath qnap-manager-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: qnap-manager-windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --pretty=%s)
          gh release create "v$VERSION" \
            qnap-manager-android.apk qnap-manager-windows.zip \
            --title "v$VERSION" --notes "$NOTES"

  # 빌드 결과를 builds 브랜치에 버전 폴더(v1.0.N/)로 저장한다.
  # 작업 폴더에서 `python3 tools/buildstore.py fetch` 로 받아갈 수 있다.
  # 한쪽(Android/Windows)만 성공해도 저장한다.
  publish-builds:
    needs: [android, windows]
    if: ${{ always() && (needs.android.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    concurrency: builds-branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: new
          merge-multiple: true
      - name: builds 브랜치 갱신
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG=$(git log -1 --pretty=%s)
          mkdir store
          if git fetch --depth 1 origin builds; then
            git archive FETCH_HEAD | tar -x -C store
          fi
          python3 tools/buildstore.py add store new \
            --version "$VERSION" --commit "${GITHUB_SHA::7}" --message "$MSG" --keep 3
          cd store
          git init -q -b builds
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "builds: v$VERSION"
          # 저장소가 커지지 않도록 항상 커밋 하나로 덮어쓴다 (이전 버전은 Releases에 있음)
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" builds
